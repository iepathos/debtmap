name: Debtmap

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Cancel in-progress runs when new commits are pushed
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: Technical Debt Validation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Set up mbx build cache
      uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
      with:
        cache-key: ${{ runner.os }}-${{ runner.arch }}-mbx-debtmap-${{ hashFiles('rust-toolchain.toml') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-mbx-debtmap-${{ hashFiles('rust-toolchain.toml') }}-

    - name: Build debtmap debug binary
      run: |
        mbx build
        echo "Disk space after debug build:"
        df -h

    - name: Run debtmap validation
      run: ./target/debug/debtmap validate . --format json --output debtmap-report.json --context

    - name: Upload debtmap report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: debtmap-analysis-artifacts
        path: debtmap-report.json
        retention-days: 7

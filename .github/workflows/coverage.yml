name: Code Coverage

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancel in-progress runs when new commits are pushed
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview

    - name: Set up mbx build cache
      uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
      with:
        cache-key: ${{ runner.os }}-${{ runner.arch }}-mbx-coverage-${{ hashFiles('rust-toolchain.toml') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-mbx-coverage-${{ hashFiles('rust-toolchain.toml') }}-

    - name: Install coverage tools
      uses: taiki-e/install-action@v2.87.14
      with:
        tool: cargo-llvm-cov,just

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        df -h

    - name: Generate and check representative coverage
      run: just coverage-check

    - name: Generate LCOV report
      run: just coverage-report-lcov

    - name: Generate HTML coverage report
      if: github.event_name == 'push'
      run: just coverage-report-html

    - name: Archive code coverage results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: code-coverage-report
        path: target/coverage/

# Scheduled workflow to test against upcoming Rust versions and latest dependencies
# Runs monthly to catch Rust ecosystem issues before they affect development
name: rust-next

permissions:
  contents: read

# First of each month at midnight UTC
on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta]
        include:
          # Only test nightly on Linux to reduce CI time
          - os: ubuntu-latest
            rust: nightly
    # Beta and nightly failures are non-blocking to avoid breaking on known issues
    continue-on-error: ${{ matrix.rust != 'stable' }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"

      - name: Configure vendored OpenSSL prerequisites (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = "C:\Strawberry\perl\bin\perl.exe"
          if (-not (Test-Path $perl)) {
            choco install strawberryperl --no-progress -y
          }
          & $perl -MLocale::Maketext::Simple -e 1
          "PERL=$perl" >> $env:GITHUB_ENV
          "OPENSSL_SRC_PERL=$perl" >> $env:GITHUB_ENV

      - name: Run tests
        run: cargo test --workspace

  latest:
    name: Check latest dependencies
    runs-on: ubuntu-latest
    env:
      # Select the newest dependency versions compatible with the declared MSRV.
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
      CARGO_PROFILE_DEV_DEBUG: line-tables-only

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"

      - name: Update dependencies to latest versions
        run: cargo update

      - name: Run tests
        run: cargo test --workspace

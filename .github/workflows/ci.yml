name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel in-progress runs when new commits are pushed
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUSTFLAGS: "-Dwarnings"
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Set up mbx build cache
      uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
      with:
        cache-key: ${{ runner.os }}-${{ runner.arch }}-mbx-ci-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-mbx-ci-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-

    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2.87.14
      with:
        tool: cargo-nextest

    - name: Run tests (Unix)
      if: runner.os != 'Windows'
      run: |
        echo "Running tests with cargo nextest..."
        mbx nextest run --lib \
          --test analyzer_tests --test complexity_tests --test core_metrics_tests \
          --test debt_tests --test entropy_tests \
          --test rust_method_resolution_cached \
          --test data_flow_identity_matrix \
          --test rust_resolution_namespace_matrix \
          --test compare_safety_test \
          --status-level fail --final-status-level slow

    - name: Configure vendored OpenSSL prerequisites (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $perl = "C:\Strawberry\perl\bin\perl.exe"
        if (-not (Test-Path $perl)) {
          choco install strawberryperl --no-progress -y
        }
        & $perl -MLocale::Maketext::Simple -e 1
        "PERL=$perl" >> $env:GITHUB_ENV
        "OPENSSL_SRC_PERL=$perl" >> $env:GITHUB_ENV

    - name: Run tests (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Write-Output "Running tests with cargo nextest..."
        mbx nextest run --lib `
          --test analyzer_tests `
          --test complexity_tests --test core_metrics_tests `
          --test debt_tests --test entropy_tests `
          --test rust_method_resolution_cached `
          --test data_flow_identity_matrix `
          --test rust_resolution_namespace_matrix `
          --test compare_safety_test `
          --status-level fail --final-status-level slow

  integration:
    name: Integration (Ubuntu, debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Set up mbx build cache
      uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
      with:
        cache-key: ${{ runner.os }}-${{ runner.arch }}-mbx-ci-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-mbx-ci-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-

    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2.87.14
      with:
        tool: cargo-nextest

    - name: Run bounded integration suite
      run: |
        mbx nextest run --profile integration \
          --test language_tests \
          --test python_extraction_test \
          --test batch_integration \
          --test solidity_analyzer_tests \
          --test call_graph_disambiguation_test \
          --test output_format_tests \
          --test cli_output_format_integration_test \
          --test config_contract_integration_test \
          --test json_output_contract_test \
          --test compare_integration_test \
          --test compare_safety_test \
          --test parallel_sequential_equivalence_test \
          --test data_flow_identity_matrix \
          --test rust_resolution_constraint_matrix \
          --test rust_resolution_namespace_matrix \
          --test rust_resolution_matrix_oracles \
          --test rust_resolution_matrix_invariants \
          --test rust_resolution_matrix_assertions \
          --test recursive_dependency_metrics \
          --status-level fail --final-status-level slow

    - name: Verify installer contract
      run: |
        bash -n install.sh tests/install_script_test.sh
        shellcheck install.sh tests/install_script_test.sh
        bash tests/install_script_test.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt

    - name: Check formatting
      run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Set up mbx build cache
      uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
      with:
        cache-key: ${{ runner.os }}-${{ runner.arch }}-mbx-ci-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-mbx-ci-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-

    - name: Install SARIF tools
      run: cargo install clippy-sarif sarif-fmt --locked

    - name: Run Clippy with SARIF output
      run: >
        mbx clippy --workspace --all-features --all-targets --message-format=json
        | clippy-sarif
        | tee clippy-results.sarif
        | sarif-fmt
      continue-on-error: true

    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: clippy-results.sarif
        wait-for-processing: true

    - name: Check for errors
      run: mbx clippy --all-targets --all-features -- -D warnings

  msrv:
    name: Check MSRV
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Set up mbx build cache
      uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
      with:
        cache-key: ${{ runner.os }}-${{ runner.arch }}-mbx-ci-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-mbx-ci-${{ github.job }}-${{ hashFiles('rust-toolchain.toml') }}-

    - name: Install cargo-hack
      uses: taiki-e/install-action@cargo-hack

    - name: Check MSRV
      run: mbx hack check --locked --rust-version --workspace --all-targets --keep-going

  minimal-versions:
    name: Minimal versions
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable

    - name: Install Rust nightly
      uses: dtolnay/rust-toolchain@nightly

    - name: Set up mbx build cache
      uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
      with:
        cache-key: ${{ runner.os }}-${{ runner.arch }}-mbx-ci-${{ github.job }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-mbx-ci-${{ github.job }}-
        toolchain: stable

    - name: Generate minimal lockfile
      run: cargo +nightly generate-lockfile -Z minimal-versions

    - name: Check with minimal versions
      run: mbx +stable check --workspace --all-features --locked

  # Aggregation job that reports overall CI status
  ci:
    name: CI
    needs: [test, integration, lint, clippy, msrv, minimal-versions]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Failed
        run: exit 1
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')

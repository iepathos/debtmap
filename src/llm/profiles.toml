# Built-in model profiles for the LLM editability estimate.
#
# The numbers are heuristic priors, not measurements. Override any field under
# [llm_editability.profiles.<id>] or add custom profiles there.
#
# Tiers hold the full parameter set. Model families inherit a tier and set
# provider, aliases, context sizes and any overrides. Family ids are
# version-agnostic; aliases are case-insensitive globs matched against the names
# users pass in `models` or `--llm-models`. When several aliases match, the most
# specific one (most literal characters) wins.
#
# Model lineups change often: check aliases and context sizes against provider
# documentation when updating this file.
#
# capability                Baseline logit; higher means stronger.
# cost_tier                 Relative cost, 1 = cheapest. Recommendations pick the
#                           cheapest model that clears its `feasible` threshold.
# effective_context_tokens  Context the model reliably uses; larger functions
#                           (with callee signatures) get the `human` verdict.
# tolerance.<feature>       Value at which the feature counts as "half hard".
# sensitivity.<feature>     Per-model multiplier on the feature's penalty.

[tiers.frontier_reasoning]
capability = 4.0
cost_tier = 4
context_window = 200000
effective_context_tokens = 120000
tolerance = { unit_tokens = 2000.0, context_tokens = 32000.0, reasoning = 70.0, ripple = 40.0 }
sensitivity = { unit_tokens = 0.9, context_tokens = 0.9, reasoning = 0.9, ripple = 0.9, verification_gap = 0.9, side_effects = 0.9 }

[tiers.frontier]
capability = 3.5
cost_tier = 3
context_window = 200000
effective_context_tokens = 100000
tolerance = { unit_tokens = 1200.0, context_tokens = 16000.0, reasoning = 45.0, ripple = 25.0 }
sensitivity = { unit_tokens = 1.0, context_tokens = 1.0, reasoning = 1.0, ripple = 1.0, verification_gap = 1.0, side_effects = 1.0 }

[tiers.mid]
capability = 3.0
cost_tier = 2
context_window = 128000
effective_context_tokens = 48000
tolerance = { unit_tokens = 600.0, context_tokens = 8000.0, reasoning = 25.0, ripple = 12.0 }
sensitivity = { unit_tokens = 1.1, context_tokens = 1.1, reasoning = 1.1, ripple = 1.1, verification_gap = 1.1, side_effects = 1.1 }

[tiers.small_local]
capability = 2.5
cost_tier = 1
context_window = 32000
effective_context_tokens = 12000
tolerance = { unit_tokens = 300.0, context_tokens = 3000.0, reasoning = 12.0, ripple = 6.0 }
sensitivity = { unit_tokens = 1.25, context_tokens = 1.25, reasoning = 1.25, ripple = 1.25, verification_gap = 1.25, side_effects = 1.25 }

# --- Anthropic ---------------------------------------------------------------

[models.claude-opus]
provider = "anthropic"
inherits = "tier:frontier_reasoning"
aliases = ["claude-opus*", "claude-*-opus*", "opus"]
context_window = 200000

[models.claude-sonnet]
provider = "anthropic"
inherits = "tier:frontier"
aliases = ["claude-sonnet*", "claude-*-sonnet*", "sonnet"]
context_window = 200000
capability = 3.7

[models.claude-haiku]
provider = "anthropic"
inherits = "tier:mid"
aliases = ["claude-haiku*", "claude-*-haiku*", "haiku"]
context_window = 200000
effective_context_tokens = 80000

